// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// How a rebuilt autostrut is made to hold the vessel's original shape, one of:
// - OriginalPose: the autostrut is set up on the vessel's original shape, and the stock joint is left as it
//   is. The AutoStrutDrift patch of KSP Community Fixes, which this replaces, is turned off.
// - TwistLimitKSPCF: the lower twist limit of the autostruts AutoStrutDrift of KSP Community Fixes handles is
//   fixed, so that AutoStrutDrift, left on, can bring the part back by itself. This changes the game: those
//   autostruts then twist as easily as they bend, where stock holds their twist firmly.
// - TwistLimit: the same, for every part joint KSP sets up, attach joints and every autostrut included. This
//   changes the game more: every joint of every vessel then twists as easily as it bends.
// Without KSP Community Fixes, the two TwistLimit modes bring nothing back to the original shape.
mode = OriginalPose

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line for every autostrut
// built in flight, with how far its part was from the vessel's original shape at that instant.
logLevel = Info
